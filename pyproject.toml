[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kcv-agent"
version = "0.1.0"
description = "Deterministic validation for claim-ledger-centred verification workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hamed Khalilian" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hamedkhalilian/knowledge-centred-verification-agent"
Documentation = "https://github.com/hamedkhalilian/knowledge-centred-verification-agent/tree/main/docs"
Issues = "https://github.com/hamedkhalilian/knowledge-centred-verification-agent/issues"
Source = "https://github.com/hamedkhalilian/knowledge-centred-verification-agent"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
kcv-validate = "kcv_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
